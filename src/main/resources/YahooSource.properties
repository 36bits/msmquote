# URLs
url.cookie.1 = https://extern.yahoo.com
url.cookie.2 = https://fc.yahoo.com
url.api.1 = https://query1.finance.yahoo.com/v7/finance/quote?
url.api.2 = https://query2.finance.yahoo.com/v7/finance/quote?
url.api.crumb = https://query1.finance.yahoo.com/v1/test/getcrumb

# URL parameters
url.param.symbols = symbols=

# HTTP parameters
http.client-timeout = 30
http.user-agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:150.0) Gecko/20100101 Firefox/150.0
# Space separated list of TLS versions
http.tls-versions = TLSv1.3
http.cookie-name = A3

# Regular expressions 
regex.crumb = \\S{11}$
regex.quote-data = \\{"(quoteResponse|chart)":\\{"result":\\[.*\\Q],"error":null}}\\E

# Preference storage keys
pref-key.cookie = YahooCookie
pref-key.crumb = YahooAPICrumb